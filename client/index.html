<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>town-zero</title>
  <!-- No icon file: an empty data URI stops the browser asking for /favicon.ico (a 404). -->
  <link rel="icon" href="data:,">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #111; }
    #game-container {
      position: relative; width: 100%; height: 100%;
    }
    #game-canvas {
      display: block; width: 100%; height: 100%;
    }

    /* HUD overlay */
    #hud {
      position: absolute; top: 0; left: 0; right: 0; bottom: 0;
      pointer-events: none; font: 14px monospace; color: #eee;
    }
    #hud > * { pointer-events: auto; }

    #hud-top-left {
      position: absolute; top: 12px; left: 12px;
    }
    #hp-bar-container {
      width: 120px; height: 12px; background: #333; border: 1px solid #555;
      margin-bottom: 4px;
    }
    #hp-bar {
      height: 100%; background: #4a4; transition: width 0.3s;
    }
    #hp-text { font-size: 12px; margin-bottom: 6px; }
    #inventory { font-size: 13px; }

    /* Your name: a button that turns into a text field to rename. */
    #name-row { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
    #name-btn {
      font: 13px monospace; color: #4af; background: none; border: none;
      padding: 0; cursor: pointer; white-space: nowrap;
    }
    /* Cut the name, not the ✎ that says the button renames. */
    #name-text {
      display: inline-block; vertical-align: bottom; max-width: 36vw;
      overflow: hidden; text-overflow: ellipsis;
    }
    #name-btn:hover, #name-btn:focus-visible { text-decoration: underline; }
    #name-input {
      font: 13px monospace; color: #eee; background: #222; border: 1px solid #4af;
      padding: 1px 4px; width: min(34ch, 60vw); /* 16 wide (CJK) characters */
    }
    #name-hint { font-size: 11px; color: #aaa; }
    #name-row .hidden { display: none; }

    /* Players online, each in the color the map draws them in. */
    #player-list {
      position: absolute; top: 12px; right: 12px; list-style: none;
      font-size: 12px; background: rgba(0,0,0,0.6); padding: 6px 10px; border-radius: 4px;
    }
    #player-list:empty { display: none; }
    #player-list { max-width: 40vw; max-height: 50vh; overflow-y: auto; }
    #player-list li { display: flex; align-items: center; gap: 6px; line-height: 1.6; }
    #player-list li span:last-child { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    #player-list li.dead { opacity: 0.5; }
    #player-list .swatch {
      width: 9px; height: 9px; transform: rotate(45deg); flex: none;
    }

    #key-hints {
      position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%);
      font-size: 12px; color: #888; background: rgba(0,0,0,0.6);
      padding: 4px 12px; border-radius: 4px;
    }

    #commit {
      position: absolute; bottom: 12px; right: 12px;
      font-size: 11px; color: #666;
    }

    /* Overlays */
    .overlay {
      position: absolute; top: 0; left: 0; right: 0; bottom: 0;
      display: flex; align-items: center; justify-content: center;
      background: rgba(0,0,0,0.7); font: 20px monospace; color: #eee;
      flex-direction: column; gap: 16px;
    }
    .overlay.hidden { display: none; }
    /* The status region stays rendered; a live region that turns visible
       is often not announced. Only the notice inside it is shown or hidden. */
    #update-notice {
      position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
      background: #333; color: #eee; border: 1px solid #666;
      font: 14px monospace; padding: 8px 12px; display: flex; gap: 12px; align-items: center;
    }
    #update-notice.hidden { display: none; }
    #update-notice button {
      font: 14px monospace; padding: 4px 12px; cursor: pointer;
      background: #555; color: #eee; border: 1px solid #888;
    }
    #update-notice button:hover { background: #777; }
    .overlay button {
      font: 16px monospace; padding: 8px 20px; cursor: pointer;
      background: #333; color: #eee; border: 1px solid #666;
    }
    .overlay button:hover { background: #555; }
    .overlay button:disabled { opacity: 0.5; cursor: default; }

    /* Dialogue overlay */
    #dialogue-overlay {
      position: absolute; bottom: 0; left: 0; right: 0;
      background: rgba(0,0,0,0.85); border-top: 2px solid #555;
      padding: 16px 24px; font: 14px monospace; color: #eee;
      min-height: 120px;
    }
    #dialogue-overlay.hidden { display: none; }
    .dlg-speaker {
      font-size: 13px; color: #8cf; margin-bottom: 8px; font-weight: bold;
    }
    .dlg-content { line-height: 1.5; margin-bottom: 8px; }
    .dlg-options { margin-top: 4px; }
    .dlg-option {
      padding: 4px 8px; margin: 2px 0; color: #ccc;
    }
    .dlg-option.selected {
      background: #335; color: #fff;
    }
    .dlg-option.selected::before { content: "\25B6 "; }
    .dlg-option.disabled {
      color: #666; font-style: italic;
    }
    .dlg-timer {
      position: absolute; top: 8px; right: 16px;
      font-size: 12px; color: #aaa;
    }
    .dlg-timer.hidden { display: none; }
    .dlg-timer-warn { color: #f66; }
    .dlg-hint {
      position: absolute; bottom: 8px; right: 16px;
      font-size: 11px; color: #666;
    }
  </style>
</head>
<body>
  <div id="game-container">
    <canvas id="game-canvas"></canvas>
    <div id="hud">
      <div id="hud-top-left">
        <div id="name-row">
          <button id="name-btn" type="button" title="Change your name"><span id="name-text"></span> ✎</button>
          <input id="name-input" class="hidden" type="text" aria-label="Your name" autocomplete="off" spellcheck="false">
          <span id="name-hint" class="hidden">← click to rename</span>
        </div>
        <div id="hp-text">HP: 100/100</div>
        <div id="hp-bar-container"><div id="hp-bar" style="width:100%"></div></div>
        <div id="inventory">🍖0 🪵0 💰0</div>
      </div>
      <div id="key-hints">WASD:Move  E:Interact  Q:Attack  G:Gather  T:Deposit</div>
      <ul id="player-list" aria-label="Players online"></ul>
      <div id="commit">%VITE_COMMIT%</div>
    </div>

    <div id="update-banner" role="status">
      <div id="update-notice" class="hidden">
        The server runs a different version of the game.
        <button id="reload-btn">Reload</button>
      </div>
    </div>
    <div id="connecting-overlay" class="overlay">Connecting...</div>
    <div id="death-overlay" class="overlay hidden">
      <div>You Died</div>
      <button id="revive-btn" disabled>Revive</button>
    </div>
    <div id="error-overlay" class="overlay hidden">
      <div id="error-text">Connection failed</div>
      <button id="retry-btn">Retry</button>
    </div>

    <div id="dialogue-overlay" class="hidden">
      <div class="dlg-speaker"></div>
      <div class="dlg-content"></div>
      <div class="dlg-options"></div>
      <span class="dlg-timer hidden"></span>
      <span class="dlg-hint">W/S:Select  E:Confirm  Esc:Close</span>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
