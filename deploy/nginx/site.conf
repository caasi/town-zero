# nginx site for town-zero behind an existing nginx. Replace game.example.com
# and the certificate paths. compose publishes the container's ports on the
# host's loopback only:
#   2567 Colyseus (matchmaking over HTTP, game over WebSocket)
#   2568 built client files
# Colyseus answers every path on its own port, so nginx picks the port:
# WebSocket upgrades and /matchmake/ go to the game, the rest to the client.

# This nginx is the edge: X-Forwarded-For is set to the peer address, not
# appended to, so a client cannot forge it (Colyseus reads it first). Behind
# another proxy, use set_real_ip_from and real_ip_header instead.

map $http_upgrade $town_zero_upstream {
  websocket 127.0.0.1:2567;
  default   127.0.0.1:2568;
}

# /matchmake/ is an unauthenticated POST that creates rooms. Players send a
# few; scripts get 429 instead of filling the server.
limit_req_zone $binary_remote_addr zone=town_zero_matchmake:1m rate=2r/s;

map $http_upgrade $town_zero_connection {
  websocket upgrade;
  default   "";
}

server {
  listen 80;
  listen [::]:80;
  server_name game.example.com;
  return 301 https://$host$request_uri;
}

server {
  # "listen ... http2" works on nginx before 1.25.1; on newer versions it only
  # logs a deprecation warning, and "http2 on;" can replace it.
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name game.example.com;

  ssl_certificate     /path/to/fullchain.pem;
  ssl_certificate_key /path/to/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;

  # Add the ACME challenge location your certificate client needs here.

  location /matchmake/ {
    limit_req zone=town_zero_matchmake burst=10 nodelay;
    limit_req_status 429;
    proxy_pass http://127.0.0.1:2567;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location / {
    proxy_pass http://$town_zero_upstream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $town_zero_connection;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    # A quiet game socket must not be closed after the default 60 s.
    proxy_read_timeout 1h;
  }
}
